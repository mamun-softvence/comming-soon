<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0E1E30" />
      <stop offset="100%" stop-color="#050910" />
    </radialGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#0E3D60" />
      <stop offset="100%" stop-color="#FF5353" />
    </linearGradient>

    <!-- Network Line Gradient -->
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="30%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#FF7555" />
    </linearGradient>

    <!-- Shutter Gradient -->
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19334D" />
      <stop offset="100%" stop-color="#0D1D2E" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="arrowShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Icon Container (Rounded Squircle) -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2.5" />

  <!-- Outer Orbit / Badge Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#162E45" stroke-width="3.5" />
  <circle cx="64" cy="64" r="50" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Digital Network Constellation Web -->
  <g stroke="url(#netGrad)" stroke-width="1.2">
    <!-- Connecting struts between outer ring and inner aperture -->
    <line x1="28" y1="42" x2="48" y2="38" />
    <line x1="48" y1="38" x2="64" y2="24" />
    <line x1="64" y1="24" x2="80" y2="38" />
    <line x1="80" y1="38" x2="100" y2="42" />
    
    <line x1="100" y1="42" x2="104" y2="64" />
    <line x1="104" y1="64" x2="98" y2="86" />
    <line x1="98" y1="86" x2="80" y2="98" />
    <line x1="80" y1="98" x2="64" y2="104" />
    
    <line x1="64" y1="104" x2="48" y2="98" />
    <line x1="48" y1="98" x2="28" y2="86" />
    <line x1="28" y1="86" x2="24" y2="64" />
    <line x1="24" y1="64" x2="28" y2="42" />

    <!-- Cross triangulation web -->
    <line x1="28" y1="42" x2="42" y2="52" opacity="0.6" />
    <line x1="100" y1="42" x2="86" y2="52" opacity="0.6" />
    <line x1="98" y1="86" x2="86" y2="76" opacity="0.6" />
    <line x1="28" y1="86" x2="42" y2="76" opacity="0.6" />
  </g>

  <!-- Constellation Nodes (Cyan Tech Dots) -->
  <g fill="#00E5FF">
    <circle cx="64" cy="24" r="2.8" />
    <circle cx="48" cy="38" r="2.4" />
    <circle cx="80" cy="38" r="2.4" />
    <circle cx="28" cy="42" r="2.6" />
    <circle cx="100" cy="42" r="2.6" />
    <circle cx="24" cy="64" r="2.8" />
    <circle cx="104" cy="64" r="2.8" />
    <circle cx="28" cy="86" r="2.6" />
    <circle cx="98" cy="86" r="2.6" />
    <circle cx="48" cy="98" r="2.4" />
    <circle cx="80" cy="98" r="2.4" />
    <circle cx="64" cy="104" r="2.8" />
  </g>

  <!-- Camera Aperture / Shutter Housing -->
  <circle cx="64" cy="64" r="27" fill="#091421" stroke="#38BDF8" stroke-width="2" />

  <!-- Shutter Blades (Geometric Aperture Iris) -->
  <g fill="url(#irisGrad)" stroke="#1F4263" stroke-width="1.2">
    <!-- Blade 1 -->
    <path d="M64 37 L78 48 L64 54 Z" />
    <!-- Blade 2 -->
    <path d="M78 48 L87 64 L74 66 Z" />
    <!-- Blade 3 -->
    <path d="M87 64 L78 80 L68 70 Z" />
    <!-- Blade 4 -->
    <path d="M78 80 L64 91 L54 78 Z" />
    <!-- Blade 5 -->
    <path d="M64 91 L50 80 L54 64 Z" />
    <!-- Blade 6 -->
    <path d="M50 48 L64 37 L60 54 Z" />
  </g>

  <!-- Center Aperture Portal -->
  <circle cx="64" cy="64" r="9" fill="#040810" stroke="#00E5FF" stroke-width="1.5" opacity="0.8" />

  <!-- Dynamic Ascending Growth Arrow (Crimson/Coral Vector) -->
  <g filter="url(#arrowShadow)">
    <!-- Lightning / Zigzag Path -->
    <path d="M 23 103 
             L 37 83 
             L 49 93 
             L 94 36" 
          fill="none" 
          stroke="url(#arrowGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Sharp Arrowhead pointing Up & Right -->
    <polygon points="107,21 85,26 99,44" fill="url(#arrowGrad)" stroke="#FF6B6B" stroke-width="1" />
  </g>

  <!-- Kinetic Flash Highlight on Arrow Tip -->
  <circle cx="106" cy="22" r="3" fill="#FFFFFF" opacity="0.9" filter="url(#glow)" />
</svg>
